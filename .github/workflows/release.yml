name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            archive: zip
            exe: .exe
          - goos: windows
            goarch: arm64
            archive: zip
            exe: .exe
          - goos: linux
            goarch: amd64
            archive: tar.gz
            exe: ""
          - goos: linux
            goarch: arm64
            archive: tar.gz
            exe: ""
          - goos: darwin
            goarch: amd64
            archive: tar.gz
            exe: ""
          - goos: darwin
            goarch: arm64
            archive: tar.gz
            exe: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          name="sonolus-pack_${TAG}_${GOOS}_${GOARCH}"
          binary="${name}${{ matrix.exe }}"
          go build -trimpath -ldflags="-s -w -X main.version=${TAG}" -o "dist/${binary}" ./cmd/sonolus-pack-go
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            python3 -m zipfile -c "${name}.zip" "${binary}"
          else
            tar -czf "${name}.tar.gz" "${binary}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sonolus-pack-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  upload:
    name: Upload release assets
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Generate checksums
        run: |
          set -euo pipefail
          find dist -type f \( -name '*.zip' -o -name '*.tar.gz' \) -print0 \
            | sort -z \
            | xargs -0 sha256sum > checksums.txt

      - name: Upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          files=$(find dist -type f \( -name '*.zip' -o -name '*.tar.gz' \) | sort)
          gh release upload "${TAG}" ${files} checksums.txt --clobber
